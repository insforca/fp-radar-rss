<!doctype html>
<!-- Purpose:    Ayuda a publicar en el móvil el artículo de la newsletter: copia título y texto, y abre el editor. Se publica en fpaldia.es/fp-al-dia/linkedin/.
     Stale when: cambia el enlace del editor de LinkedIn o el formato que genera difusion_nube.enlace_linkedin.
     Lessons:    03/11/2026: LinkedIn no permite abrir el editor con el texto puesto y la app solo crea publicaciones individuales. En el navegador del móvil, sí se abre el editor con la newsletter.
                 Los textos van tras la «#» del enlace: no llegan al servidor y la página no guarda nada. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Publicar en LinkedIn · FP al día</title>
<style>
  :root { --azul: #0057b8; --gris: #5f6b7a; --fondo: #f5f7fa; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; background: var(--fondo); color: #17202a; font: 17px/1.45 Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 18px; color: var(--azul); }
  section { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--gris); font-weight: normal; }
  button, a.boton { display: block; width: 100%; min-height: 50px; padding: 12px; border: 0; border-radius: 8px; background: var(--azul); color: #fff; font: bold 17px Arial, sans-serif; text-align: center; text-decoration: none; cursor: pointer; }
  button.hecho { background: #1e8449; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.4 Arial, sans-serif; color: var(--gris); margin: 10px 0 0; max-height: 150px; overflow: auto; }
  #error { display: none; background: #fdecea; color: #922b21; padding: 12px; border-radius: 8px; }
.pill-sitio{display:flex;gap:2px;background:#fff;border:1.5px solid #111;border-radius:999px;padding:4px;width:max-content;max-width:100%;margin:12px auto 18px}.pill-sitio a{color:#111;text-decoration:none;font:600 13px/1 'Archivo',sans-serif;padding:9px 13px;border-radius:999px;white-space:nowrap}.pill-sitio a.on{background:#111;color:#fff}.nav-sitio{display:flex;justify-content:center}</style>
</head>
<body>
<main>
  <h1>Publicar en LinkedIn</h1>
  <p id="error">Este enlace no trae el texto. Ábrelo desde el correo de la edición.</p>
  <div id="pasos">
    <section><h2>1. Abre el editor</h2><a class="boton" href="https://www.linkedin.com/article/new/" target="_blank" rel="noopener">Abrir el editor</a></section>
    <section><h2>2. Título</h2><button type="button" data-copia="titulo">Copiar título</button><pre id="titulo"></pre></section>
    <section><h2>3. Texto, con el enlace</h2><button type="button" data-copia="texto">Copiar texto</button><pre id="texto"></pre></section>
    <section><h2>4. Portada</h2><a class="boton" href="portada.png" download="fp_al_dia_portada.png">Descargar el logo</a></section>
    <section><h2>5. Al publicar, en el cuadro de la publicación</h2><button type="button" data-copia="publicacion">Copiar publicación</button><pre id="publicacion"></pre></section>
  </div>
</main>
<script>
  function leer(valor) {
    var b = atob(valor.replace(/-/g, '+').replace(/_/g, '/'));
    return new TextDecoder().decode(Uint8Array.from(b, function (c) { return c.charCodeAt(0); }));
  }
  // El artículo se copia también con formato, para que la noticia llegue enlazada. Ese HTML solo va al portapapeles: nunca se pinta en la página.
  function copiar(texto, conFormato) {
    if (conFormato && navigator.clipboard && navigator.clipboard.write && window.ClipboardItem && window.isSecureContext) {
      return navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([conFormato], { type: 'text/html' }),
        'text/plain': new Blob([texto], { type: 'text/plain' })
      })]).catch(function () { return copiar(texto); });
    }
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto);
    var t = document.createElement('textarea');
    t.value = texto;
    document.body.appendChild(t);
    t.select();
    var ok = document.execCommand('copy');
    t.remove();
    return ok ? Promise.resolve() : Promise.reject(new Error('sin portapapeles'));
  }
  var html = '';
  try {
    var datos = new URLSearchParams(location.hash.slice(1));
    document.getElementById('titulo').textContent = leer(datos.get('t'));
    document.getElementById('texto').textContent = leer(datos.get('c'));
    html = datos.get('h') ? leer(datos.get('h')) : '';
    if (datos.get('p')) document.getElementById('publicacion').textContent = leer(datos.get('p'));
    else document.getElementById('publicacion').parentNode.style.display = 'none';
  } catch (e) {
    document.getElementById('pasos').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
  document.querySelectorAll('[data-copia]').forEach(function (b) {
    var inicial = b.textContent;
    b.addEventListener('click', function () {
      copiar(document.getElementById(b.dataset.copia).textContent, b.dataset.copia === 'texto' ? html : '').then(function () {
        b.textContent = 'Copiado ✓';
        b.classList.add('hecho');
      }, function () {
        b.textContent = 'No se pudo: selecciona el texto de abajo';
      });
      setTimeout(function () { b.textContent = inicial; b.classList.remove('hecho'); }, 4000);
    });
  });
</script>
</body>
</html>
